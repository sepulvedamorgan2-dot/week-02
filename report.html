      <!-- TODO: alert alert-info — "nothing is saved yet" (that's week 6's problem) -->

      <!-- TODO: form — form-label + form-control for each field, form-select for the dropdown,
         submit button; keep the form ≤ 8 columns wide on md+ (hint: row + col-md-8) -->
      <form class="col-12 col-md-8 card">
        <div class="p-3">
          <h1 class="pb-5">Report a Sighting</h1>
          <div class="mb-3">
            <label for="name">Your name</label>
            <input type="text" class="form-control" id="name">
          </div>

          <div class="mb-3">
            <label for="email">Email</label>
            <input type="email" id="email" class="form-control">
          </div>

          <div class="mb-3">
            <label for="cryptid">Which one did you see?</label>
            <select class="form-control" id="cryptid">
              <option>Choose…</option>
              <option>The Hodag</option>
              <option>Bigfoot</option>
              <option>Mothman</option>
              <option>The Loch Ness Monster</option>
              <option>The Jersey Devil</option>
              <option>Chupacabra</option>
              <option>Something not in the registry</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="account">What did you see?</label>
            <textarea class="form-control" id="account" rows="4"></textarea>
          </div>
          <button class="btn btn-primary w-100 py-2" type="submit">File report</button>
        </div>
      </form>
